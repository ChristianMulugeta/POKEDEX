<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="style/assets.css" />
    <link rel="stylesheet" href="style/colors.css" />
    <link rel="icon" href="./assets/img/load_more_img.png">
  </head>
  <body onload="onloadFunc()">

    <div id="loadingSpinner">
      <img id="spinnerImg" src="./assets/img/load_more_img.png" alt="Pokémon werden geladen">
    </div>

    <div class="header">
      <div class="contentbegrenzung_header">
        <img src="./assets/img/load_more_img.png" alt="" />
        <span class="logo_text">Pok&eacute;dex</span>
        <select
          id="languageSelect"
          class="language_select"
          onchange="changeLanguage(this.value)"
          aria-label="Sprache auswählen"
        >
          <option value="de">DE</option>
          <option value="en">EN</option>
          <option value="fr">FR</option>
          <option value="it">IT</option>
        </select>
          <div class="searchbar">
            <div class="search_area">
              <input
                id="searchInput"
                type="text"
                placeholder="Pokémon suchen..."
                aria-label="Pokémon suchen"
              />
              <button id="search_btn" onclick="filterAndShowPokemons(document.getElementById('searchInput').value)">
                Search
              </button>
            </div>
          <div id="min_letters_hint">
            min. 3 letters
          </div>
        </div>
      </div>
    </div>

    <div class="main_container">
      <div id="pokemon_list" class="pokemon_gallerie"></div>
      <div id="notFoundMessage" class="not_found_message" style="display: none;">
        Pokemon not found...
      </div>
      <div id="loadMoreBtn" class="load_more" onclick="loadMorebtn()">
        <img id="loadMoreImg" src="./assets/img/load_more_img.png" alt="">
        <p id="loadMoreText">Load more...</p>
      </div>
    </div>

    <div id="fullImgBox" onclick="backgroundClick(event)">
      <div class="dialog_box">
        <button class="nav_btn left" onclick="prevPokemon(event)" aria-label="Vorheriges Pokémon">❮</button>

        <img id="fullImg" alt="" />

        <button class="nav_btn right" onclick="nextPokemon(event)" aria-label="Nächstes Pokémon">❯</button>
        <div id="dialogTypeIcons" class="dialog_box_type_icons"></div>
        <div id="fullImgStats" class="dialog_box_stats"></div>
      </div>
    </div>

    <div class="footer">
      <span>2025 Developer Akademie GmbH</span>
    </div>

    <script src="scripts/translations.js"></script>
    <script src="script.js"></script>
    <script src="scripts/template.js"></script>
  </body>


</html>
